<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TinyMCE File Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="app.css">
  <script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
</head>
<body>
  <header><h1>TinyMCE File Manager</h1><nav id="breadcrumb" class="breadcrumb"></nav></header>
  <section class="toolbar">
    <button type="button" id="btn-up">Up</button>
    <button type="button" id="btn-mkdir">New Folder</button>
    <label class="upload">Upload<input id="file-input" type="file" multiple hidden></label>
    <button type="button" id="btn-refresh">Refresh</button>
    
  </section>
  
  <section class="editor-wrap"><textarea id="editor">TinyMCE file manager demo.</textarea></section>
  <main>
    <table id="file-table">
      <thead><tr><th>Name</th><th>Size</th><th>Modified (UTC)</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </main>
  <script src="app.js"></script>
</body>
</html>
